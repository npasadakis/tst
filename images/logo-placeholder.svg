<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0077be" stroke="#005a91" stroke-width="2"/>

  <!-- Sailboat -->
  <g transform="translate(50, 50)">
    <!-- Hull -->
    <path d="M -15 10 Q 0 15 15 10 L 10 15 L -10 15 Z" fill="#ffffff"/>

    <!-- Mast -->
    <line x1="0" y1="-25" x2="0" y2="10" stroke="#ffffff" stroke-width="2"/>

    <!-- Main Sail -->
    <path d="M 0 -25 L 20 5 L 0 5 Z" fill="#ffffff" opacity="0.9"/>

    <!-- Jib Sail -->
    <path d="M 0 -20 L -15 0 L 0 0 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Waves -->
    <path d="M -30 18 Q -25 16 -20 18 Q -15 20 -10 18 Q -5 16 0 18 Q 5 20 10 18 Q 15 16 20 18 Q 25 20 30 18"
          stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
</svg>
