<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)"/>

  <!-- Sailboat -->
  <g transform="translate(100, 100)">
    <!-- Hull -->
    <path d="M -30 30 L -30 20 L 30 20 L 30 30 Q 20 40 0 40 Q -20 40 -30 30 Z" fill="white"/>

    <!-- Mast -->
    <rect x="-3" y="-50" width="6" height="70" fill="white"/>

    <!-- Main Sail -->
    <path d="M 0 -50 L 35 10 L 0 10 Z" fill="white" opacity="0.9"/>

    <!-- Front Sail -->
    <path d="M 0 -40 L -30 10 L 0 10 Z" fill="white" opacity="0.7"/>

    <!-- Flag -->
    <path d="M 0 -50 L 12 -45 L 0 -40 Z" fill="#90e0ef"/>
  </g>

  <!-- Waves -->
  <path d="M 20 160 Q 40 155 60 160 Q 80 165 100 160 Q 120 155 140 160 Q 160 165 180 160"
        stroke="#90e0ef" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 20 170 Q 40 165 60 170 Q 80 175 100 170 Q 120 165 140 170 Q 160 175 180 170"
        stroke="#90e0ef" stroke-width="3" fill="none" opacity="0.4"/>
</svg>
